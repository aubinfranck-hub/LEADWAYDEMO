:root{
  --ink:#37254D;--ink-2:#5B4C72;--night:#231636;
  --orange:#F08020;--orange-soft:#FDE9D4;--orange-d:#9A4A06;
  --paper:#F6F4F8;--card:#FFFFFF;--line:#E2DCEA;--line-2:#CBC2D8;
  --ok:#1B7650;--ok-bg:#DFF3E8;--bad:#A52F29;--bad-bg:#FBE3E0;--warn:#744808;--warn-bg:#FDEFD2;--info:#2C497A;--info-bg:#E7ECF7;
  --wa:#1C8C4E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:450 15.5px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img,svg{max-width:100%}
.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper);position:relative}
@media(min-width:600px){body{background:#E3DDEC}.app{box-shadow:0 0 0 1px var(--line)}}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}
.ic.lg{width:28px;height:28px}

/* bandeau et en-tête */
.ribbon{position:sticky;top:0;z-index:40;background:var(--orange-soft);color:var(--ink);font-size:12.5px;font-weight:650;text-align:center;padding:5px 12px;border-bottom:1px solid #F1C99C}
.top{position:sticky;top:27px;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line)}
.logo{height:34px;width:auto;display:block}
.seg{display:flex;background:var(--paper);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:999px;font-size:13px;font-weight:650;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.topload{position:sticky;top:78px;z-index:29;height:3px;margin-bottom:-3px;overflow:hidden;pointer-events:none}
.topload.on::after{content:"";display:block;height:100%;width:40%;background:var(--orange);animation:sweep .32s ease-out forwards}
@keyframes sweep{0%{transform:translateX(-100%);opacity:1}75%{opacity:1}100%{transform:translateX(260%);opacity:0}}

main{flex:1;display:flex;flex-direction:column;outline:none;min-width:0}
.scr{flex:1 0 auto;display:flex;flex-direction:column;padding:18px 16px 24px;min-width:0}
.scr>*{min-width:0}
h1{font-size:27px;line-height:1.12;font-weight:760;letter-spacing:-.022em;margin:6px 0 8px;outline:none}
h2{font-size:19px;line-height:1.2;font-weight:700;letter-spacing:-.012em;margin:0 0 6px}
h3{font-size:16px;line-height:1.25;font-weight:700;margin:0}
p{margin:0 0 10px}
.lead{font-size:16.5px;color:var(--ink-2);margin-bottom:16px}
.hint{font-size:13.5px;color:var(--ink-2);margin:8px 0 0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tc{text-align:center}
.mt{margin-top:16px}.mt2{margin-top:24px}
.lnk{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:650}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:650;background:#EAE5F1;color:var(--ink)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.or{background:var(--orange-soft);color:var(--orange-d)}

/* boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:56px;padding:0 22px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:16.5px;font-weight:700;text-align:center;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.orange{background:var(--orange);color:var(--night)}
.btn.sm{min-height:44px;font-size:14.5px;padding:0 16px;width:auto}
.btn.bad{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.btn:disabled,.btn[aria-disabled=true]{background:#D6CFE1;color:#6A5F7C;box-shadow:none;cursor:not-allowed}
.btn.wa{background:var(--wa);color:#fff}
.iconbtn{width:56px;min-height:56px;border-radius:50%;border:0;background:var(--wa);color:#fff;display:grid;place-items:center;flex:none}
.row{display:flex;gap:10px;align-items:center}
.row>.btn{flex:1}
.stack>*+*{margin-top:10px}
.back{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-2);background:#fff;color:var(--ink)}

/* pied de page collant */
.foot{margin-top:auto;position:sticky;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));margin-left:-16px;margin-right:-16px}
.foot.row{gap:10px}
.spacer{height:20px;flex:none}

/* progression */
.flowhead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.count{font-size:14px;font-weight:650;color:var(--ink-2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);list-style:none;margin:12px 0 0;padding:0}
.steps li{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;line-height:1.15;text-align:center;color:var(--ink-2);position:relative;font-weight:560;padding:0 2px}
.steps li::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line-2)}
.steps li:first-child::before{display:none}
.steps .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:750;background:#fff;border:1.5px solid var(--line-2);color:var(--ink-2);position:relative;z-index:1}
.steps .dot .ic{width:14px;height:14px;stroke-width:3}
.steps li.done::before,.steps li.cur::before{background:var(--ink)}
.steps li.done .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.steps li.cur .dot{background:var(--orange);border-color:var(--orange);color:var(--night)}
.steps li.cur{color:var(--ink);font-weight:760}
.prog{height:4px;background:var(--line);border-radius:4px;margin:12px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .4s ease}

/* formulaires */
.field{margin:0 0 16px}
.field label,.lab{display:block;font-size:14px;font-weight:650;margin:0 0 6px}
.inp{position:relative;display:flex;align-items:center;background:#fff;border:1.5px solid var(--line-2);border-radius:16px;min-height:56px}
.inp:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px #F0802040}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;padding:0 16px;min-height:54px;font-size:17px;outline:none;border-radius:16px}
.inp .pre{padding:0 12px 0 16px;font-weight:700;color:var(--ink-2);border-right:1.5px solid var(--line);align-self:stretch;display:flex;align-items:center}
.inp .suf{padding:0 16px 0 0;font-weight:700;color:var(--ink-2)}
.inp select{appearance:none;-webkit-appearance:none;padding-right:40px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%2337254D' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 14px center}
.inp.err{border-color:var(--bad)}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:11px 13px;font-size:14px;line-height:1.4;margin:12px 0 0;background:var(--info-bg);color:var(--info)}
.note .ic{margin-top:1px}
.note.err{background:var(--bad-bg);color:var(--bad);font-weight:600}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.plain{background:#fff;color:var(--ink-2);border:1px solid var(--line)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;margin:14px 0 0}
.check input{width:24px;height:24px;margin:0;accent-color:var(--ink);flex:none}

/* choix */
.grid2,.grid3{display:grid;gap:10px}
.grid2{grid-template-columns:1fr 1fr}
.grid3{grid-template-columns:repeat(3,1fr)}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:92px;padding:12px 6px;border:1.5px solid var(--line-2);border-radius:20px;background:#fff;text-align:center;font-weight:680;font-size:15px;line-height:1.2}
.opt small{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.opt .mono{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.opt[aria-checked=true]{border-color:var(--ink);background:var(--orange-soft);box-shadow:inset 0 0 0 1.5px var(--ink)}
.opt[aria-checked=true]::after{content:"";position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--ink) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5l4.5 4.5L19 7.5'/></svg>") center/12px no-repeat}
.ropt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line-2);border-radius:20px;background:#fff;min-height:64px}
.ropt+.ropt{margin-top:10px}
.ropt .rad{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center}
.ropt b{display:block;font-weight:700}
.ropt span.s{display:block;font-size:13.5px;color:var(--ink-2)}
.ropt[aria-checked=true]{border-color:var(--ink);background:var(--orange-soft);box-shadow:inset 0 0 0 1.5px var(--ink)}
.ropt[aria-checked=true] .rad{border-color:var(--ink);background:var(--ink) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5l4.5 4.5L19 7.5'/></svg>") center/14px no-repeat}
.ropt[aria-disabled=true]{opacity:.55;background:#F0EDF4}
details.more{margin-top:14px;background:#fff;border:1.5px solid var(--line-2);border-radius:20px;padding:0 14px}
details.more>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:54px;font-weight:700;cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary .ic{transform:rotate(90deg)}
.srow{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;min-height:48px;padding:0 4px;font-weight:600}
.srow[aria-checked=true]{color:var(--orange-d);font-weight:760}
.srow[hidden]{display:none}
.slist{max-height:230px;overflow:auto;margin:8px 0 12px;-webkit-overflow-scrolling:touch}
.counter{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0 6px}
.counter button{width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center}
.counter .num{font-size:60px;line-height:1;font-weight:800;min-width:96px;text-align:center;letter-spacing:-.03em}
.counter .unit{display:block;font-size:14px;font-weight:600;color:var(--ink-2);text-align:center}

/* carte grise (schéma) */
.schema{margin:16px 0 0;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:12px}
.schema svg{width:100%;height:auto;display:block}
.schema figcaption{font-size:13px;color:var(--ink-2);margin-top:6px}

/* prix */
.hero-price{background:var(--night);color:#fff;border-radius:30px;padding:24px 22px 22px;margin:10px 0 0}
.hero-price .ctx{font-size:14px;color:#D9CFE8;margin:0 0 14px}
.hero-price .big{font-size:62px;line-height:1;font-weight:800;letter-spacing:-.035em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero-price .big small{font-size:20px;font-weight:650;letter-spacing:0;color:#E9DFF5}
.hero-price .per{margin:10px 0 0;font-size:16px;color:#F1EAF9}
.hero-price .valid{display:inline-flex;gap:8px;align-items:center;margin-top:16px;background:var(--orange);color:var(--night);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}

/* cartes génériques */
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin:0 0 12px}
.card.tight{padding:12px 14px}
.card h3+p{margin-top:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:0;font-size:15px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;text-align:right;font-weight:650;overflow-wrap:anywhere}
.kv.tot{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:17px}
.kv.tot dt{color:var(--ink);font-weight:700}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:680}
.li .s{font-size:13.5px;color:var(--ink-2)}
.gap8{gap:8px}
.wrap{flex-wrap:wrap}
.right{margin-left:auto;text-align:right}

/* produits (accueil) */
.hero{margin:4px 0 14px}
.hero h1{font-size:32px;line-height:1.08;margin:10px 0 10px}
.checks{list-style:none;margin:14px 0 0;padding:0}
.checks li{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;font-weight:560}
.checks .ic{color:var(--ok);stroke-width:3;margin-top:2px}
.prods{display:grid;gap:10px;margin:0}
.prod{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:22px;background:#fff;padding:14px 16px;min-height:76px}
.prod.main{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.prod .pi{width:46px;height:46px;border-radius:16px;background:var(--paper);display:grid;place-items:center;flex:none;color:var(--ink)}
.prod.main .pi{background:var(--ink);color:#fff}
.prod b{display:block;font-size:16.5px}
.prod span.s{font-size:13.5px;color:var(--ink-2);display:block;line-height:1.3}

/* formules */
.fcard{background:#fff;border:1.5px solid var(--line-2);border-radius:26px;padding:18px 16px 16px;margin:0 0 14px}
.fcard.off{background:#F0EDF4;border-style:dashed}
.fcard header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fcard .ins{font-size:13.5px;color:var(--ink-2);margin:2px 0 0}
.fprice{margin:14px 0 10px}
.fprice b{display:block;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.03em}
.fprice span{font-size:14px;color:var(--ink-2)}
.cov{list-style:none;margin:0 0 10px;padding:0}
.cov li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;margin:0 0 6px}
.cov li.y .ic{color:var(--ok);stroke-width:3}
.cov li.n{color:#7A6E8C}
.cov li.n .ic{color:#A79DB6}
.acc{border-top:1px solid var(--line);padding:10px 0 2px;margin:0 0 12px;font-size:14px}
.acc summary{font-weight:680;min-height:34px;display:flex;align-items:center;cursor:pointer}
.acc ul{margin:6px 0 4px;padding-left:18px}
.acc li{margin:0 0 4px}

/* aide */
.spin{width:54px;height:54px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--orange);animation:rot .9s linear infinite;margin:0 auto}
@keyframes rot{to{transform:rotate(360deg)}}
.center{margin:auto 0;text-align:center;padding:30px 0}
.center h1{margin-top:20px}
.sms{background:#fff;border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:12px 14px;font-size:14.5px;margin:12px 0 0;box-shadow:0 1px 0 var(--line)}
.sms b{font-size:17px;letter-spacing:.05em}
.sms .from{font-size:12.5px;color:var(--ink-2);margin-bottom:2px}
.tl{list-style:none;margin:20px auto 0;padding:0;text-align:left;max-width:310px}
.tl li{display:flex;gap:12px;align-items:center;padding:8px 0;color:var(--ink-2);font-weight:560}
.tl li .d{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;background:#fff}
.tl li.on{color:var(--ink)}
.tl li.on .d{background:var(--ok);border-color:var(--ok);color:#fff}
.tl li.on .d .ic{width:14px;height:14px;stroke-width:3.4}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;margin:14px 0}
.tabs button{flex:1;border:0;background:transparent;min-height:40px;border-radius:999px;font-weight:680;color:var(--ink-2);font-size:14.5px}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line-2);background:#fff;border-radius:999px;min-height:40px;padding:0 14px;font-weight:650;font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 10px}
.kpi b{display:block;font-size:26px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--ink-2);line-height:1.2;display:block;margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;min-height:100px}
.tile b{font-size:15.5px}
.tile .n{font-size:26px;font-weight:800;line-height:1}
.tile .ic{color:var(--ink)}

/* attestation */
.att{position:relative;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:18px 16px;overflow:hidden}
.att::after{content:"SPÉCIMEN — sans valeur d'assurance";position:absolute;left:-30%;right:-30%;top:46%;text-align:center;transform:rotate(-22deg);font-size:20px;font-weight:800;color:#A52F2935;border-top:3px solid #A52F2935;border-bottom:3px solid #A52F2935;padding:6px 0;pointer-events:none;letter-spacing:.01em}
.att h3{font-size:17px;margin-bottom:2px}
.att .qr{float:right;margin:0 0 8px 12px;width:92px;height:92px}
.att .qr svg{width:100%;height:100%;display:block}

/* sheet, toast */
.scrim{position:fixed;inset:0;background:rgba(35,22,54,.52);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.scrim[hidden]{display:none}
.sheet{background:#fff;border-radius:30px 30px 0 0;width:100%;max-width:440px;padding:12px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--line-2);margin:0 auto 14px}
.sheet h2{font-size:21px}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--night);color:#fff;border-radius:16px;padding:12px 16px;font-size:14.5px;font-weight:600;max-width:min(400px,calc(100vw - 32px));opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.camera{position:relative;background:#1E1630;border-radius:22px;aspect-ratio:4/3;display:grid;place-items:center;color:#fff;margin:12px 0}
.camera .frame{width:78%;aspect-ratio:1.58;border-radius:12px;position:relative;border:2px dashed #FFFFFF99;display:grid;place-items:center;font-size:13.5px;padding:10px;text-align:center}

/* barre du bas */
.tabbar{position:sticky;bottom:0;z-index:25;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:end;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tabbar[hidden]{display:none}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;justify-content:center;font-size:12px;font-weight:650;color:var(--ink-2)}
.tabbar button[aria-current=page]{color:var(--ink)}
.tabbar button[aria-current=page] .ic{stroke-width:2.6}
.tabbar button[aria-current=page]::before{content:"";width:22px;height:3px;border-radius:3px;background:var(--orange);margin-bottom:1px}
.tabbar .sos{width:62px;height:62px;border-radius:50%;background:var(--bad);color:#fff;margin:-26px auto 0;min-height:62px;box-shadow:0 0 0 5px #fff;display:grid;place-items:center;gap:0}
.tabbar .sos span{font-size:11px}
.tabbar .sos .ic{margin:0}

/* barre fixe de l'accueil */
.dock{display:flex;gap:10px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ajouts */
.cardbtn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:22px;padding:16px;margin:0 0 12px}
.cardbtn:active{background:#FBFAFD}
.inp.otp input{font-size:30px;letter-spacing:.4em;text-align:center;font-weight:760;padding-left:.4em}
.inp textarea{font:inherit}
.inp input[type=date]{min-height:54px}
.row.wrap{flex-wrap:wrap}
.hero-price .big small:first-child{font-size:20px}
.fcard .btn{margin-top:4px}
.card .btn+.btn{margin-top:10px}
.stack .lnk{display:inline-block;min-height:44px}
h1:focus,h1:focus-visible{outline:none}
.mt{margin-top:16px}.mt2{margin-top:24px}
.sms{text-align:left}
.att::after{content:"SPÉCIMEN DE DÉMONSTRATION";font-size:15px;top:44%;letter-spacing:.04em}
.acc summary{list-style:none;justify-content:space-between}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:18px;height:18px;flex:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2337254D' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M9 6l6 6-6 6'/></svg>") center/contain no-repeat;transition:transform .2s}
.acc[open] summary::after{transform:rotate(90deg)}
.toast{bottom:auto;top:96px;transform:translate(-50%,-12px)}
.toast.on{transform:translate(-50%,0)}
.hero-price .valid{max-width:100%}
@media(max-width:350px){.top{padding:8px 10px;gap:6px}.logo{height:28px}.seg button{padding:7px 8px;font-size:12px}.scr{padding-left:12px;padding-right:12px}.foot{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}.chips{margin:0 -12px;padding-left:12px;padding-right:12px}.hero h1{font-size:28px}.hero-price .big{font-size:52px}}

.wm{display:flex;flex-direction:column;line-height:1.1}.wm b{font-size:20px;letter-spacing:.2px}.wm span{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#C2410C;opacity:1}

.demofoot{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#FFEDD5;color:#9A3412;font:700 10px/1 system-ui,sans-serif;letter-spacing:.6px;text-align:center;padding:5px 8px calc(5px + env(safe-area-inset-bottom));border-top:1px solid #FDBA74}body{padding-bottom:28px}

.foot,.tabbar{bottom:26px}


.wm{align-items:center;gap:5px;flex-shrink:0}.logo.leadway-logo{height:64px;width:auto;object-fit:contain}.wm span{font-size:9px;letter-spacing:.6px}@media(max-width:350px){.logo.leadway-logo{height:52px}.wm span{font-size:8px;letter-spacing:0}}
</style>
</head>
<body>
<div class="app" id="app">

}

  let x = 0; for (const c of seed) x = (x * 31 + c.charCodeAt(0)) >>> 0;
  const n = 21, cells = [];

  const c = String(S.code).trim();
  if (S.locked) { S.err = { code: 'Trop d’essais. Demandez un nouveau code pour continuer.' }; render(); return; }

  if (c !== SMS_CODE) {
    S.otpFails++;
    const left = 3 - S.otpFails;
    if (left <= 0) { S.locked = true; S.err = { code: 'Trop d’essais. Demandez un nouveau code pour continuer.' }; }

  if (S.screen === 'otp') {
    const who = S.otpFor || 'client';

ACT.valPay = (el, id) => {
  const d = findD(id); d.status = d.start > TODAY ? 'À venir' : 'Actif';
  if (!TX.find(t => t.ref === d.id)) TX.unshift({ id: 'TX-DEMO-' + (++SEQ.t), ref: d.id, label: `Prime ${fOf(d.fk).name}, ${d.veh}`, amount: d.premium, method: d.pay, date: new Date(), status: 'Payé' });
  closeSheet(); render(); toast('Paiement validé. L’attestation part chez le client.');
};
ACT.reEmit = (el, id) => { const d = findD(id); d.status = 'Actif'; closeSheet(); render(); toast('Émission relancée. L’attestation est envoyée au client.'); };

/* ---------- commercial ---------- */
SCREENS.mHome = () => {
  const my = D.filter(d => d.agent === AGENT), sold = my.filter(issued), soon = my.filter(d => issued(d) && !d.renewed && d.end >= TODAY && daysLeft(d) <= 30);
  return {
    html: `<div class="scr"><h1>Bonjour, ${AGENT}</h1><p class="lead">Votre portefeuille de clients.</p>
    <button type="button" class="btn orange" data-a="start">${ic('plus')}Nouvelle vente</button>
    <div class="kpis mt"><div class="kpi"><b>${sold.length}</b><span>contrats vendus</span></div><div class="kpi"><b>${fmt(sumP(sold) / 1000)} k</b><span>FCFA de primes</span></div><div class="kpi"><b>${my.filter(d => !issued(d)).length}</b><span>à finaliser</span></div></div>
    ${soon.length ? `<h2 class="mt">À renouveler</h2>${soon.map(d => `<div class="card tight"><div class="li"><div><div class="t">${esc(d.client)}, ${esc(d.veh)}</div><div class="s">Échéance le ${fdate(d.end)}</div></div><a class="btn wa sm" target="_blank" rel="noopener" href="${waLink(`Bonjour ${d.client}, votre assurance ${d.veh} arrive à échéance le ${fdate(d.end)}. Voulez-vous la renouveler ?`)}" aria-label="Relancer ${esc(d.client)} sur WhatsApp">${ic('wa', 'sm')}Relancer</a></div></div>`).join('')}` : ''}
    <h2 class="mt">Mes ventes</h2>${my.length ? my.map(d => `<button type="button" class="cardbtn" data-a="dsheet" data-v="${d.id}"><div class="row gap8" style="align-items:flex-start"><div style="flex:1"><h3>${esc(d.client)}</h3><p class="muted small">${esc(d.veh)}, ${fOf(d.fk).name}</p></div>${stBadge(d)}</div><p class="small mt">${fcfa(d.premium)}, ${sdate(d.created)}</p></button>`).join('') : empty('doc', 'Aucune vente pour l’instant', 'Vos contrats vendus s’affichent ici.', '')}
    <button type="button" class="lnk mt" data-a="logoutRole">Me déconnecter</button></div>`
  };
};
ACT.logoutRole = () => { S.auth[S.role] = false; S.hist = []; toast('Vous êtes déconnecté.'); go(roleHome(), { push: false }); };

/* ---------- Leadway : tableau de bord ---------- */
const TABS = [['att', 'À traiter'], ['dos', 'Dossiers'], ['pay', 'Paiements'], ['sin', 'Sinistres'], ['rap', 'Rappels']];
function toDo() {
  return {
    pay: D.filter(d => d.status === 'Paiement à vérifier'), fail: D.filter(d => d.status === 'Émission en échec'),
    sin: SIN.filter(s => s.status === 'Reçu'), rap: LEADS.filter(l => !l.done)
  };
}
SCREENS.aHome = () => {
  const t = toDo(), n = t.pay.length + t.fail.length + t.sin.length + t.rap.length, paid = TX.filter(x => x.status === 'Payé');
  let body = '';
  if (S.tab === 'att') {
    body = (n === 0 ? empty('check', 'Rien à traiter', 'Les paiements à vérifier, les émissions en échec, les sinistres et les rappels apparaissent ici.') : '') +
      t.pay.map(d => `<div class="card"><div class="row gap8" style="align-items:flex-start"><div style="flex:1"><h3>Paiement à vérifier</h3><p class="muted small">${esc(d.client)}, ${esc(d.veh)}, ${esc(d.pay)}</p></div><span class="badge warn">${fcfa(d.premium)}</span></div><div class="row gap8 mt"><button type="button" class="btn sm" data-a="valPay" data-v="${d.id}">Valider le paiement</button><button type="button" class="btn ghost sm" data-a="dsheet" data-v="${d.id}">Détail</button></div></div>`).join('') +
      t.fail.map(d => `<div class="card"><div class="row gap8" style="align-items:flex-start"><div style="flex:1"><h3>Émission en échec</h3><p class="muted small">${esc(d.client)}, ${esc(d.veh)}, ${esc(d.ins)}</p></div><span class="badge bad">${fcfa(d.premium)}</span></div><p class="small mt">Le client a payé, l’attestation n’est pas partie.</p><div class="row gap8 mt"><button type="button" class="btn sm" data-a="reEmit" data-v="${d.id}">Relancer l’émission</button><button type="button" class="btn ghost sm" data-a="dsheet" data-v="${d.id}">Détail</button></div></div>`).join('') +
      t.sin.map(s => `<div class="card"><div class="row gap8" style="align-items:flex-start"><div style="flex:1"><h3>Sinistre ${s.id}</h3><p class="muted small">${esc(s.client)}, ${esc(s.veh)}, ${esc(s.type)}</p></div><span class="badge info">${s.status}</span></div><p class="small mt">${esc(s.desc)}</p><button type="button" class="btn sm mt" data-a="sinTake" data-v="${s.id}">Prendre en charge</button></div>`).join('') +
      t.rap.map((l, i) => leadCard(l)).join('');
  } else if (S.tab === 'dos') {
    const F = [['Tous', () => true], ['Actifs', d => stOf(d).t === 'Actif'], ['À vérifier', d => d.status === 'Paiement à vérifier'], ['En échec', d => d.status === 'Émission en échec'], ['Échéance proche', d => issued(d) && d.end >= TODAY && daysLeft(d) <= 30]];
    const f = F.find(x => x[0] === S.aFilter) || F[0], q = (S.aq || '').toLowerCase();
    const list = D.filter(f[1]).filter(d => !q || (d.id + d.client + d.plate + d.veh + d.phone).toLowerCase().includes(q));
    body = `<div class="chips" role="group" aria-label="Filtrer les dossiers">${F.map(([l]) => `<button type="button" class="chip" aria-pressed="${S.aFilter === l}" data-a="filter" data-v="${l}">${l}</button>`).join('')}</div>
    <div class="inp"><input type="search" id="f_aq" placeholder="Nom, plaque ou dossier" aria-label="Chercher un dossier" data-in="aq" value="${esc(S.aq || '')}" autocomplete="off"></div>
    <div id="dlist" class="mt">${dlist(list)}</div>
    <button type="button" class="btn ghost mt" data-a="csv">${ic('dl')}Exporter en CSV</button>`;
  } else if (S.tab === 'pay') {
    const by = {}; paid.forEach(x => by[x.method] = (by[x.method] || 0) + x.amount);
    body = `<div class="card"><h3>Encaissé par moyen de paiement</h3><dl class="kv mt">${Object.entries(by).map(([m, v]) => `<dt>${esc(m)}</dt><dd>${fcfa(v)}</dd>`).join('') || '<dt>Aucun paiement</dt><dd>-</dd>'}</dl><dl class="kv tot"><dt>Total encaissé</dt><dd>${fcfa(paid.reduce((s, x) => s + x.amount, 0))}</dd></dl></div>
    ${t.pay.length ? note(`${t.pay.length} paiement${t.pay.length > 1 ? 's' : ''} à rapprocher avec le relevé de l’opérateur.`, 'warn', 'alert') : ''}
    <div class="card mt">${TX.map(x => `<div class="li"><div><div class="t">${esc(x.label)}</div><div class="s">${x.id}, ${sdate(x.date)}, ${esc(x.method)}</div></div><div class="right">${money(x.amount)}<br><span class="badge ok">${x.status}</span></div></div>`).join('')}</div>`;
  } else if (S.tab === 'sin') {
    body = SIN.length ? SIN.map(s => `<div class="card"><div class="row gap8" style="align-items:flex-start"><div style="flex:1"><h3>${s.id}</h3><p class="muted small">${esc(s.client)}, ${esc(s.veh)}</p></div><span class="badge ${s.status === 'Reçu' ? 'info' : 'ok'}">${s.status}</span></div><p class="small mt"><b>${esc(s.type)}</b>, le ${sdate(s.date)}, ${esc(s.lieu)}${s.hurt ? ' <span class="badge bad">Blessés</span>' : ''}</p><p class="muted small">${esc(s.desc)}</p>${s.status === 'Reçu' ? `<button type="button" class="btn sm mt" data-a="sinTake" data-v="${s.id}">Prendre en charge</button>` : ''}</div>`).join('') : empty('alert', 'Aucun sinistre', 'Les déclarations des clients arrivent ici.');
  } else {
    body = LEADS.length ? LEADS.map(l => leadCard(l)).join('') : empty('phone', 'Aucune demande de rappel', 'Les demandes laissées sur l’accueil client arrivent ici.');
  }
  return {
    html: `<div class="scr"><h1>Tableau de bord</h1>
    <div class="kpis"><div class="kpi"><b>${D.length}</b><span>dossiers</span></div><div class="kpi"><b>${fmt(paid.reduce((s, x) => s + x.amount, 0) / 1000)} k</b><span>FCFA encaissés</span></div><div class="kpi"><b>${n}</b><span>à traiter</span></div></div>
    ${note('Raccordement au système de gestion de Leadway : à définir avec Leadway. Dans cette démonstration, les dossiers vivent uniquement dans l’application.', 'plain', 'info')}
    <div class="chips" role="tablist" aria-label="Sections">${TABS.map(([k, l]) => `<button type="button" class="chip" role="tab" aria-selected="${S.tab === k}" aria-pressed="${S.tab === k}" data-a="tab" data-v="${k}">${l}${k === 'att' && n ? ` (${n})` : ''}</button>`).join('')}</div>
    ${body}<button type="button" class="lnk mt" data-a="logoutRole">Me déconnecter</button></div>`
  };
};
function dlist(list) {
  if (!list.length) return note('Aucun dossier ne correspond. Modifiez le filtre ou la recherche.', 'plain', 'info');
  return list.map(d => `<button type="button" class="cardbtn" data-a="dsheet" data-v="${d.id}"><div class="row gap8" style="align-items:flex-start"><div style="flex:1"><h3>${esc(d.client)}</h3><p class="muted small">${esc(d.veh)}, ${esc(d.plate)}</p></div>${stBadge(d)}</div><p class="small mt">${d.id}, ${fcfa(d.premium)}, ${esc(d.channel)}</p></button>`).join('');
}
function leadCard(l) {
  const i = LEADS.indexOf(l);
  return `<div class="card"><div class="row gap8" style="align-items:flex-start"><div style="flex:1"><h3>${esc(l.topic)}</h3><p class="muted small">${esc(l.phone)}, ${sdate(l.when)}</p></div>${l.done ? '<span class="badge ok">Rappelé</span>' : '<span class="badge warn">À rappeler</span>'}</div><p class="small mt">${esc(l.note)}</p>${l.done ? '' : `<div class="row gap8 mt"><button type="button" class="btn sm" data-a="leadDone" data-v="${i}">Rappelé</button><a class="btn wa sm" target="_blank" rel="noopener" href="${waLink('Bonjour, Leadway vous contacte au sujet de votre demande ' + l.topic.toLowerCase() + '.')}" aria-label="Écrire sur WhatsApp">${ic('wa', 'sm')}</a></div>`}</div>`;
}
ACT.tab = (el, v) => { S.tab = v; render(); };
ACT.filter = (el, v) => { S.aFilter = v; render(); };
IN.aq = el => { S.aq = el.value; const q = el.value.toLowerCase(); const F = { 'Tous': () => true }; $('#dlist').innerHTML = dlist(D.filter(d => !q || (d.id + d.client + d.plate + d.veh + d.phone).toLowerCase().includes(q)).filter(d => matchFilter(d))); };
function matchFilter(d) {
  const f = S.aFilter;
  if (f === 'Actifs') return stOf(d).t === 'Actif';
  if (f === 'À vérifier') return d.status === 'Paiement à vérifier';
  if (f === 'En échec') return d.status === 'Émission en échec';
  if (f === 'Échéance proche') return issued(d) && d.end >= TODAY && daysLeft(d) <= 30;
  return true;
}
ACT.sinTake = (el, id) => { const s = SIN.find(x => x.id === id); s.status = 'En cours'; render(); toast('Sinistre pris en charge : ' + id + '.'); };
ACT.leadDone = (el, i) => { LEADS[Number(i)].done = true; render(); toast('Demande marquée comme rappelée.'); };
ACT.csv = () => {
  const head = ['Dossier', 'Client', 'Téléphone', 'Véhicule', 'Immatriculation', 'Formule', 'Assureur', 'Prime (FCFA)', 'Statut', 'Paiement', 'Canal', 'Agent', 'Début', 'Fin'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const q2 = (S.aq || '').toLowerCase();
  const rows = D.filter(d => matchFilter(d) && (!q2 || (d.id + d.client + d.plate + d.veh + d.phone).toLowerCase().includes(q2))).map(d => [d.id, d.client, d.phone, d.veh, d.plate, fOf(d.fk).name, d.ins, d.premium, stOf(d).t, d.pay, d.channel, d.agent, sdate(d.start), sdate(d.end)].map(q).join(';'));
  download('dossiers-leadway-demo.csv', 'text/csv;charset=utf-8', '﻿' + [head.map(q).join(';'), ...rows].join('\r\n'));
  toast(rows.length + ' dossier' + (rows.length > 1 ? 's' : '') + ' exporté' + (rows.length > 1 ? 's' : '') + '.');
};

/* ============ branchement global ============ */
const blankU = () => ({ phone: '', first: '', last: '', dob: '', cni: '', email: '', plate: '', importe: false });
S._u = {};
const ROOTS = new Set(['cHome', 'cContrats', 'cAide', 'cProfil', 'cSinistre', 'mHome', 'aHome']);
ACT.role = (el, v) => {
  if (S.role === v) return;
  closeSheet(); clearTimers();
  S._u[S.role] = S.u; S.u = S._u[v] || blankU();
  S.role = v; resetFlow(); S.hist = []; S.screen = roleHome(); S.qk = null;
  render(); window.scrollTo(0, 0);
};
ACT.go = (el, v) => {
  if (v === 'cSinistre') S.sin = freshSin();
  if (ROOTS.has(v)) { S.hist = []; go(v, { push: false }); } else go(v);
};
ACT.back = () => back();
ACT.close = () => closeSheet();
ACT.next = () => {
  const s = S.screen;
  if (s === 'q') return qNext();
  if (s === 'contact') return contactNext();
  if (s === 'identity') return identityNext();
  if (s === 'docs') return docsNext();
  if (s === 'recap') return recapNext();
  if (s === 'pay') return payNext();
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t) { if (e.target.id === 'scrim') closeSheet(); return; }
  if (t.disabled || t.getAttribute('aria-disabled') === 'true') return;
  const fn = ACT[t.dataset.a];
  if (fn) fn(t, t.dataset.v, t.dataset.k);
});
function onInput(e) {
  const el = e.target, kind = el.dataset && el.dataset.in;
  if (!kind) return;
  if (el.dataset.fmt === 'phone') el.value = phoneFmt(el.value);
  else if (el.dataset.fmt === 'plate') el.value = el.value.toUpperCase();
  const h = IN[kind];
  if (h) h(el, el.dataset.k, el.type === 'checkbox' ? el.checked : el.value);
}
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#scrim').hidden) { closeSheet(); return; }
  if (e.key === 'Enter' && e.target.matches('input:not([type=checkbox]):not([type=search])') && $('#scrim').hidden) {
    const c = $('#cta'); if (c && !c.disabled) { e.preventDefault(); c.click(); }
  }
});

IN.u = (el, k, v) => { S.u[k] = v; };
IN.a = (el, k, v) => { S.a[k] = v; };
IN.pay = (el, k, v) => { S.pay[k] = v; };
IN.lg = (el, k, v) => { S.lg[k] = v; };
IN.lead = (el, k, v) => { S.lead[k] = v; };
IN.chk = (el, k, v) => { if (k === 'consent') S.consent = v; if (k === 'agree') S.agree = v; };
IN.sin = (el, k, v) => { const m = { sdate: 'date', slieu: 'lieu', desc: 'desc', hurt: 'hurt' }; S.sin[m[k] || k] = v; if (k === 'hurt') render(); };
IN.num = (el, k) => {
  const n = parseInt(el.value.replace(/\D/g, ''), 10) || 0;
  S.a[k] = n; el.value = n ? fmt(n) : ''; if (k === 'vactuelle') S.a.vtouched = true;
  if (k === 'vneuve' && !S.a.vtouched) { autoVal(); const o = $('#f_vactuelle'); if (o) o.value = S.a.vactuelle ? fmt(S.a.vactuelle) : ''; }
};

S.screen = 'home'; render();

</script>
</body>
</html>
